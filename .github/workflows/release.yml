name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# GitHub occasionally delivers the same tag-push event twice, spawning two
# runs that race each other in the publish-crate job. Queue duplicates
# instead; the already-published guard makes the second run a no-op.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: kindling-cli-mac-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            name: kindling-cli-mac-intel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: kindling-cli-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: kindling-cli-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/kindling-cli ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/kindling-cli.exe ${{ matrix.name }}

      # Cargo leaves macOS binaries ad-hoc signed, so a browser download carries
      # the quarantine xattr and Gatekeeper blocks the first run with "Apple
      # could not verify ... is free of malware". Sign with a Developer ID and
      # notarize so that dialog never appears. Both steps no-op when the signing
      # secrets are absent (forks, or before the secrets are configured) so a
      # release still builds, just unsigned as before.
      - name: Check for signing secrets
        if: runner.os == 'macOS'
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets absent - shipping an unsigned binary"
          fi

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Without this the codesign invocation below blocks on a GUI keychain
          # prompt that no one is there to answer, and the job hangs until timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign binary
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # --options runtime (hardened runtime) and --timestamp are both
          # mandatory for notarization; Apple rejects the submission without them.
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "${{ matrix.name }}"
          codesign --verify --strict --verbose=2 "${{ matrix.name }}"

      - name: Notarize binary
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p8"
          # notarytool only accepts an archive, never a bare Mach-O. The ticket it
          # issues is keyed on the binary's code directory hash, so zipping purely
          # for transport still covers the raw binary we upload as the asset.
          ditto -c -k "${{ matrix.name }}" "$RUNNER_TEMP/notarize.zip"
          set +e
          OUT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json)
          RC=$?
          set -e
          echo "$OUT"
          STATUS=$(printf '%s' "$OUT" | jq -r '.status // "unknown"')
          SUBMISSION=$(printf '%s' "$OUT" | jq -r '.id // empty')
          # --wait has historically exited 0 on an Invalid result, so gate on the
          # status field rather than trusting the exit code alone.
          if [ "$STATUS" != "Accepted" ] || [ "$RC" -ne 0 ]; then
            echo "Notarization failed (status=$STATUS rc=$RC)"
            if [ -n "$SUBMISSION" ]; then
              xcrun notarytool log "$SUBMISSION" \
                --key "$RUNNER_TEMP/key.p8" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            rm -f "$RUNNER_TEMP/key.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/key.p8"
          # A notarization ticket cannot be stapled to a bare executable (stapler
          # only handles .app/.dmg/.pkg), so Gatekeeper resolves this one online at
          # first run. That is fine for anyone with a network connection.

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # crates.io rejects requests without a User-Agent (HTTP 403), which
          # made this check never return 200, so the skip below never fired and
          # cargo publish ran on an already-published version and failed the job.
          status=$(curl -sS -A "kindling-release (https://github.com/ciscoriordan/kindling)" \
            -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/kindling-mobi/$TAG_VERSION")
          if [ "$status" = "200" ]; then
            echo "kindling-mobi $TAG_VERSION already on crates.io - skipping publish"
            exit 0
          fi
          # --allow-dirty: if a version bump committed a stale Cargo.lock,
          # cargo regenerates it here, leaving the tag checkout dirty and
          # aborting the publish. Tolerate that (the only diff is the lock's
          # own version line). Best practice is still to commit Cargo.lock
          # alongside the Cargo.toml bump.
          cargo publish --allow-dirty
